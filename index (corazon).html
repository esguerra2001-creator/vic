<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corazón Brillante Te Quiero Mi Osita</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Great Vibes', cursive;
            position: relative;
        }
        #top-text {
            position: absolute;
            top: 12%;
            color: #00bfff;
            font-size: 5rem;
            font-weight: bold;
            text-shadow: 0 0 20px #00bfff, 0 0 40px #00bfff;
            z-index: 10;
        }
        #center-text {
            position: absolute;
            color: #00bfff;
            font-size: 4rem;
            font-weight: bold;
            text-shadow: 0 0 15px #00bfff, 0 0 30px #00bfff;
            z-index: 10;
            pointer-events: none;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <div id="top-text">Te quiero</div>
    <div id="center-text">mi osita</div>
    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById("heartCanvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        const particles = [];
        const numParticles = 600;

        function getHeartPoint(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            return { x: x * 16, y: y * 16 };
        }

        class Particle {
            constructor() {
                this.init();
            }

            init() {
                const t = Math.random() * Math.PI * 2;
                const p = getHeartPoint(t);
                this.baseX = canvas.width / 2 + p.x;
                this.baseY = canvas.height / 2 + p.y;
                this.x = this.baseX + (Math.random() - 0.5) * 20;
                this.y = this.baseY + (Math.random() - 0.5) * 20;
                this.size = Math.random() * 2.5 + 1;
                this.speedX = (Math.random() - 0.5) * 3.5;
                this.speedY = (Math.random() - 0.5) * 3.5;
                this.alpha = Math.random() * 0.7 + 0.3;
                this.decay = Math.random() * 0.015 + 0.008;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.alpha -= this.decay;
                if (this.alpha <= 0) {
                    this.init();
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = "#00bfff";
                ctx.shadowBlur = 12;
                ctx.shadowColor = "#00bfff";
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < numParticles; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>

</body>
</html>
